name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install check tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck
          version="0.13.6"
          archive="uv-x86_64-unknown-linux-gnu.tar.gz"
          archive_sha256="f29c3e94ffabd7e6f3ba521dba169a9b7ec12100bf3257087f0f24f6123f3645"
          tool_directory="$RUNNER_TEMP/uv"
          mkdir -p "${tool_directory}"
          curl -sSfL -o "$RUNNER_TEMP/${archive}" "https://github.com/astral-sh/uv/releases/download/${version}/${archive}"
          echo "${archive_sha256}  $RUNNER_TEMP/${archive}" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/${archive}" --strip-components=1 -C "${tool_directory}"
          echo "${tool_directory}" >> "$GITHUB_PATH"

      - name: Run repository checks
        run: ./scripts/check.sh
