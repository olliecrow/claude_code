name: Security Policy Checks

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Weekly advisory refresh. Version-update bots are not used.
    - cron: "41 6 * * 1"

permissions:
  contents: read

jobs:
  security-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          archive_sha256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          workdir="${RUNNER_TEMP}/gitleaks-install"
          mkdir -p "${workdir}"
          curl -sSfL -o "${workdir}/${archive}" "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          echo "${archive_sha256}  ${workdir}/${archive}" | sha256sum -c -
          tar -xzf "${workdir}/${archive}" -C "${workdir}"
          install -m 0755 "${workdir}/gitleaks" "${RUNNER_TEMP}/gitleaks"
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"

      - name: Install osv-scanner
        run: |
          set -euo pipefail
          version="2.7.0"
          binary="osv-scanner_linux_amd64"
          binary_sha256="160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b"
          curl -sSfL -o "${RUNNER_TEMP}/${binary}" "https://github.com/google/osv-scanner/releases/download/v${version}/${binary}"
          echo "${binary_sha256}  ${RUNNER_TEMP}/${binary}" | sha256sum -c -
          install -m 0755 "${RUNNER_TEMP}/${binary}" "${RUNNER_TEMP}/osv-scanner"
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"

      - name: Scan pushed commits with gitleaks
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          range="$(bash scripts/security/ci-range.sh)"
          gitleaks git --redact --verbose --config .gitleaks.toml \
            --log-opts="--diff-merges=first-parent ${range}"

      - name: Scan the current tree with gitleaks
        run: gitleaks dir --redact --verbose --config .gitleaks.toml .

      - name: Check commit messages and added lines
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: bash scripts/security/ci-push-scan.sh

      - name: Check tracked files for policy violations
        run: |
          set -euo pipefail
          mapfile -d '' tracked_files < <(git ls-files -z)
          bash scripts/security/check-sensitive-text.sh --context=tracked-file "${tracked_files[@]}"

      - name: Self-test sensitive text and push range checks
        run: bash scripts/security/self-test.sh

      - name: Scan dependency locks
        run: osv-scanner scan source -r .

      - name: Check pull request title/body for policy violations
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          temp_file="$(mktemp)"
          printf '%s\n\n%s\n' "${PR_TITLE}" "${PR_BODY}" > "${temp_file}"
          bash scripts/security/check-sensitive-text.sh --context=pr-metadata "${temp_file}"
