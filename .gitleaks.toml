title = "claude_code gitleaks policy"

[extend]
useDefault = true

[[rules]]
id = "local-system-paths"
description = "Do not commit local absolute system paths in this public-ready repository."
regex = '''/(Users/[A-Za-z0-9._-]+|home/[A-Za-z0-9._-]+)|([A-Za-z]:\\+Users\\+[A-Za-z0-9._-]+)'''
tags = ["policy", "privacy"]

[[rules.allowlists]]
description = "Allow a match only when the whole match is a placeholder path. Other paths on the same line are still reported."
regexTarget = "secret"
regexes = [
  '''^(Users/(YOU|USER|you|username)|home/(dev|user|USER|username)|[A-Za-z]:\\+Users\\+(YOU|USER|USERNAME|username))$'''
]

# Token rules need a left boundary, so words such as risk-assessment do not match.
# secretGroup keeps the boundary character out of the reported secret.
[[rules]]
id = "anthropic-token"
description = "Anthropic OAuth and API tokens"
regex = '''(?:^|[^A-Za-z0-9_-])(sk-ant-[a-z]+[0-9]{2}-[A-Za-z0-9_-]{20,})'''
secretGroup = 1

[[rules]]
id = "openai-project-token"
description = "OpenAI project API keys"
regex = '''(?:^|[^A-Za-z0-9_-])(sk-proj-[A-Za-z0-9_-]{20,})'''
secretGroup = 1

[[rules]]
id = "json-web-token"
description = "JSON web tokens with a signature"
regex = '''(?:^|[^A-Za-z0-9_-])(eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{3,}\.[A-Za-z0-9_-]{16,})'''
secretGroup = 1
